[package]
name = "image-to-paa"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Open-source PNG/TGA → Bohemia Interactive PAA converter (ImageToPAA alternative)"
license = "Apache-2.0"
repository = "https://github.com/cavazquez/ImageToPAA"
readme = "README.md"
keywords = ["arma3", "paa", "texture", "dxt"]
categories = ["command-line-utilities", "multimedia::images"]

[lib]
name = "image_to_paa"
path = "src/lib.rs"

[[bin]]
name = "image-to-paa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "tga"] }
thiserror = "2"
texpresso = "2.0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[example]]
name = "compose_paa_qa"
required-features = []

[profile.release]
lto = true
codegen-units = 1
